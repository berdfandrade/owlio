# Compila o Owlio no Windows e gera o instalador (Inno Setup).
# Em todo PR: confere que compila e empacota; o instalador fica nos artefatos da execução.
# Numa tag v*: assina o owlio.exe e o instalador pela SignPath Foundation (quando o segredo
# SIGNPATH_API_TOKEN existe) e publica o instalador numa release do GitHub.
# Configuração da SignPath: docs/CODE_SIGNING.md.
name: Windows installer

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read  # a SignPath baixa os artefatos da execução

jobs:
  build:
    runs-on: windows-latest
    env:
      # Só assina releases, e só depois que o projeto foi aceito pela SignPath.
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_mingw
          tools: tools_mingw1310
          cache: true

      - name: Put MinGW on PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:RUNNER_WORKSPACE\Qt\Tools\mingw1310_64\bin"

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") { $v = $env:GITHUB_REF_NAME.Substring(1) }
          else { $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(Owlio VERSION ([0-9.]+)').Matches[0].Groups[1].Value }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Build
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target owlio owlio_tests -j 4

      - name: Core tests
        run: build\owlio_tests.exe

      - name: Install with Qt files
        run: cmake --install build --prefix "${{ github.workspace }}/dist"  # o deploy do Qt exige caminho absoluto

      - name: Check that the app starts
        shell: pwsh
        run: |
          # Sem o Qt e o MinGW no PATH, para que falte DLL ou plugin apareça aqui, e não no usuário.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          $p = Start-Process dist\bin\owlio.exe -ArgumentList "--export-pdf","$env:RUNNER_TEMP\check.pdf","examples\$((Get-ChildItem examples -Filter *.fountain)[0].Name)" -PassThru -Wait
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$env:RUNNER_TEMP\check.pdf")) { throw "owlio.exe did not run from dist" }

      # O owlio.exe é assinado antes de entrar no instalador; o instalador, depois.
      - name: Upload owlio.exe for signing
        if: env.SIGN == 'true'
        id: unsigned-app
        uses: actions/upload-artifact@v4
        with:
          name: owlio-exe-unsigned
          path: dist/bin/owlio.exe

      - name: Sign owlio.exe
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: owlio
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600  # cada release espera a aprovação manual
          output-artifact-directory: dist/bin

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
            Add-Content $env:GITHUB_PATH "${env:ProgramFiles(x86)}\Inno Setup 6"
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=${{ steps.version.outputs.value }} packaging\owlio.iss

      - name: Upload installer for signing
        if: env.SIGN == 'true'
        id: unsigned-setup
        uses: actions/upload-artifact@v4
        with:
          name: Owlio-Setup-unsigned
          path: packaging/Output/*.exe

      - name: Sign installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: owlio
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: packaging/Output

      - name: Check signatures
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          foreach ($f in @("dist\bin\owlio.exe") + (Get-ChildItem packaging\Output\*.exe).FullName) {
            $s = Get-AuthenticodeSignature $f
            if ($s.Status -ne "Valid") { throw "$f is not signed: $($s.Status)" }
            "$f signed by $($s.SignerCertificate.Subject)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Owlio-Setup-${{ steps.version.outputs.value }}
          path: packaging/Output/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/Output/*.exe
